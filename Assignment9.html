<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 9:Quotation and Citation Elements</title>
</head>
<body>
    <!--Blockquote for a long or standalone quote-->
    <blockquote>
        The best way to predict the future is to create it.
    </blockquote>
    <!--Inline quote using the <q> element-->
        <p>As he said, <q>Stay hungry, stay foolish.</q></p>
         <!--Citation for the title of a work using the <cite>-->
            <p>Book: <cite>The Progmatic Programmer</cite> </body> </html></p>
            <!--Abbrevation with a tooltip using the <abbr> element-->
                <p><abbr title="World Wide WEb Consortium">W3C</abbr> sets web standards.</p>
                <!--contact information using the <address> element-->
                    <address>
                        Contact: Admin office<br>
                        College Road, Delhi
                        </address>
                        <!--Deleted and inserted text using <del> and <ins> elements-->
                            <p>Old price<del>₹500</del>New price<ins>₹400</ins></p>
</body>
</html>
