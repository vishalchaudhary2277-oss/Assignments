<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 7:Navigaton Menu Using lists</title>
    <style>
        /* Remove default bullet points and spacing */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #333333;
        }
        /* Align list items side-by-side horizontally */
        li {
            float: left;
        }
        /* Style the navigation link */
        li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        /*optional : Highlight link on hover */ 
        li a:hover {
            background-color: #111111;
        }
        </style> 
</head>
<body>
    <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#courses">Courses</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
    
</body>
</html>
