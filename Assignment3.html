<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 3: Block and Inline Elements</title>
    <style>
        .block-item {
            background-color: #add8e6; /* light blue background */
            margin-bottom: 5px;
            padding: 2px 5px;
        }

        .inline-item {
            background-color: #90ee90 ; /* light green background */
            padding: 2px 5px;
        }

    </style>
</head>
<body>
<!-- Block Elements -->
 <div class ="block-item"> Block 1</div>
 <div class ="block-item"> Block 2</div>

 <!-- Inline Elements-->
<span class="inline-item">Inline 1</span>
<span class="inline-item">Inline 2</span>
<span class="inline-item">Inline 3</span>    
</body>
</html>
